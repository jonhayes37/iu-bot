[project]
name = "iu-bot"
description = "A Discord bot for the HallyU server"
authors = [
    {name = "Jonathan Hayes", email = "jon.hayes37@gmail.com"}
]
maintainers = [
    {name = "Jonathan Hayes", email = "jon.hayes37@gmail.com"}
]
readme = "README.md"
license = { text = "MIT License" }
version = "1.0"
requires-python = ">=3.14,<3.15"
# Direct runtime dependencies only. uv.lock pins every transitive one; the Docker image installs
# exactly this set (no dev tools).
dependencies = [
    "discord.py==2.7.1",
    "google-api-python-client==2.192.0",
    "google-auth-oauthlib==1.2.2",
    "google-auth-httplib2==0.3.0",
    "Jinja2==3.1.6",
    # Keep in step with the Chromium build the Docker image downloads (the wheel and browser are a pair).
    "playwright==1.58.0",
]

[dependency-groups]
dev = [
    "freezegun==1.5.5",
    "isort==8.0.1",
    "mdformat==0.7.17",
    "parameterized==0.9.0",
    "pylint==4.0.5",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
]

[tool.uv]
# An application, not a library: install the dependencies but don't build/install "iu" itself.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# iu/ so tests import the code the way it imports itself (from db.lists import ...); tests/ so the
# shared helpers are importable as testsupport.*
pythonpath = ["iu", "tests"]
testpaths = ["tests"]
# importlib mode: test files need no __init__.py, so tests/db/test_lists.py and tests/ui/test_lists.py
# can share a name, and a tests/db folder can't shadow the real db package
addopts = "--import-mode=importlib"
# An unclosed SQLite connection or file shows up as an "unraisable" ResourceWarning; make it a failure
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["iu"]
omit = [
    "iu/main.py",               # wiring only, see CLAUDE.md
    "iu/scripts/*",             # one-off manual helpers
]
