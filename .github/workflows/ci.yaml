name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]
      fail-fast: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          pylint iu

      - name: Unit test
        run: pytest --cov=iu

      # Runs even when the tests fail, so a failing run reports both problems at once.
      - name: Testing coverage
        if: ${{ !cancelled() }}
        run: |
          coverage report --fail-under=80
