version: 2
updates:
  # Python dependencies: reads pyproject.toml and refreshes uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for the development tools, so they don't crowd out runtime updates.
      dev-tools:
        dependency-group: dev
    ignore:
      # Playwright must match the Chromium build baked into the image; bump it by hand and test a bracket.
      - dependency-name: playwright

  # The Dockerfile's base image and the pinned uv copied into it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
